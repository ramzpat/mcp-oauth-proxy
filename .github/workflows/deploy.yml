# Deploys grafana-mcp to Cloud Run on every push to this branch. Thin
# caller for the reusable workflow on main -- see README.md's "Deploying a
# new MCP server to Cloud Run" section for the shape this follows.
#
# `prepare` runs with `environment: grafana-mcp` so it can see this MCP's
# Environment-scoped vars, and republishes the non-secret ones as plain
# job outputs for the `deploy` job's `with:` (a job that calls a reusable
# workflow via `uses:` can't have `environment:` itself, so it can't read
# `vars.*` directly).
#
# GRAFANA_SERVICE_ACCOUNT_TOKEN is a real secret, and does NOT go through
# `prepare`'s outputs at all -- GitHub silently blanks any job output
# whose value contains a secret when it's read cross-job, so nothing
# secret-derived can survive that trip regardless of how it's composed
# (confirmed the hard way: this used to route through prepare and always
# arrived empty at deploy-service.yml). It's passed instead via the
# `secrets:` map on the `deploy` job below, onto deploy-service.yml's
# generic BACKEND_SECRET slot -- the one channel actually designed to
# carry a secret across a reusable-workflow-call boundary.
#
# No build step here anymore: the oauth-proxy image is generic and built
# once on main (.github/workflows/build.yml there), published to
# ghcr.io/<repo>. This workflow only ever deploys.

name: deploy grafana-mcp

on:
  push:
    branches: [deploy/grafana-mcp]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: grafana-mcp
    outputs:
      service: ${{ vars.SERVICE }}
      project_id: ${{ vars.PROJECT_ID }}
      region: ${{ vars.REGION }}
      workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      deployer_service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}
      allowed_domains: ${{ vars.ALLOWED_DOMAINS }}
      allowed_emails: ${{ vars.ALLOWED_EMAILS }}
      backend_env_vars: GRAFANA_URL=${{ vars.GRAFANA_URL }}
    # NOTE: the outputs: block above IS what the `deploy` job's `with:`
    # reads via needs.prepare.outputs.* -- these expressions are evaluated
    # by GitHub directly against this job's `environment:`, no step/shell
    # involved.
    steps:
      # Diagnostics: GH auto-masks any secret value that appears in logs,
      # so it's safe to print these directly even if non-empty.
      - name: diagnostics -- confirm what this job actually resolved
        run: |
          echo "ALLOWED_DOMAINS (vars)     = '${{ vars.ALLOWED_DOMAINS }}'"
          echo "ALLOWED_EMAILS (vars)      = '${{ vars.ALLOWED_EMAILS }}'"
          echo "GRAFANA_URL (vars)         = '${{ vars.GRAFANA_URL }}' (length ${#GRAFANA_URL_RAW})"
          echo "GRAFANA_TOKEN raw length   = ${#GRAFANA_TOKEN_RAW} (0 means unset/empty in the Environment -- this one bypasses prepare's outputs entirely now, see deploy job's secrets: below)"
        env:
          GRAFANA_URL_RAW: ${{ vars.GRAFANA_URL }}
          GRAFANA_TOKEN_RAW: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}

  deploy:
    needs: prepare
    permissions:
      contents: read
      id-token: write # Workload Identity Federation -- deploy-service.yml needs this granted here to use it itself
      packages: read  # deploy-service.yml resolves the proxy image's digest from ghcr.io -- needs this granted here too
    uses: ramzpat/mcp-oauth-proxy/.github/workflows/deploy-service.yml@main
    with:
      environment: grafana-mcp
      service: ${{ needs.prepare.outputs.service }}
      project_id: ${{ needs.prepare.outputs.project_id }}
      region: ${{ needs.prepare.outputs.region }}
      workload_identity_provider: ${{ needs.prepare.outputs.workload_identity_provider }}
      deployer_service_account: ${{ needs.prepare.outputs.deployer_service_account }}
      allowed_domains: ${{ needs.prepare.outputs.allowed_domains }}
      allowed_emails: ${{ needs.prepare.outputs.allowed_emails }}
      # --allowed-origins uses the full origin (scheme://host:port), not
      # the bare host -- that's the semantically correct value for an
      # Origin-header check anyway, and it also has to differ textually
      # from --allowed-hosts' bare "127.0.0.1": gcloud's --command rejects
      # a value repeated within one flag ("cannot be specified multiple
      # times"), so the literal duplicate broke this deploy.
      backend_image: grafana/mcp-grafana:latest
      # Pinned explicitly (--command) since the image's own baked-in
      # ENTRYPOINT wasn't reliably preserved by --args alone -- see
      # deploy-service.yml's backend_entrypoint input description.
      backend_entrypoint: /app/mcp-grafana
      # --args replaces the image's baked-in CMD/entrypoint-args entirely
      # (including its own default --address 0.0.0.0:8000), so --address
      # has to be repeated here explicitly -- otherwise mcp-grafana falls
      # back to its own internal default, which isn't guaranteed to match
      # backend_port, and the startup probe on that port times out.
      backend_command: -t,streamable-http,--address,0.0.0.0:8000,--allowed-hosts,127.0.0.1,--allowed-origins,http://127.0.0.1:8000
      backend_port: "8000"
      backend_env_vars: ${{ needs.prepare.outputs.backend_env_vars }}
      backend_secret_env_name: GRAFANA_SERVICE_ACCOUNT_TOKEN
    # Explicit map, not `secrets: inherit` -- BACKEND_SECRET has to be
    # *renamed* from this Environment's actual GRAFANA_SERVICE_ACCOUNT_TOKEN
    # secret onto deploy-service.yml's generic slot, which inherit can't do
    # (it forwards secrets under their original names only).
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      BACKEND_SECRET: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
