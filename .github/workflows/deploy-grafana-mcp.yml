name: deploy grafana-mcp

# Builds the oauth-proxy image and deploys it as a Cloud Run multi-container
# service in front of grafana/mcp-grafana:latest, mirroring
# examples/grafana-mcp/deploy.sh. Uses the `grafana-mcp` GitHub Environment
# for its vars/secrets so this workflow stays server-agnostic — see
# examples/grafana-mcp/README.md for the one-time GCP setup (Secret Manager
# entries, Workload Identity Federation) this assumes is already done.

on:
  push:
    branches: [main]
    paths:
      - app.py
      - requirements.txt
      - Dockerfile
      - examples/grafana-mcp/**
      - .github/workflows/deploy-grafana-mcp.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: grafana-mcp
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      SERVICE: ${{ vars.SERVICE || 'grafana-mcp' }}
      AR_REPO: ${{ vars.AR_REPO || 'mcp' }}
      GRAFANA_URL: ${{ vars.GRAFANA_URL || 'https://monitoring.pattaravut.info' }}
      ALLOWED_DOMAINS: ${{ vars.ALLOWED_DOMAINS || 'pattaravut.info' }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev"

      - id: build
        name: build+push oauth-proxy image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/oauth-proxy:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: deploy to Cloud Run
        env:
          PROXY_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail

          deploy() {
            local public_url="$1"
            gcloud run deploy "$SERVICE" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --allow-unauthenticated \
              --min-instances=0 --max-instances=3 \
              --no-cpu-throttling \
              --container=grafana-mcp \
                --image=grafana/mcp-grafana:latest \
                --command=-t,streamable-http,--allowed-hosts,127.0.0.1,--allowed-origins,127.0.0.1 \
                --set-env-vars="GRAFANA_URL=${GRAFANA_URL},PORT=8000,HOST=127.0.0.1" \
                --set-secrets="GRAFANA_SERVICE_ACCOUNT_TOKEN=grafana-mcp-token:latest" \
              --container=oauth-proxy \
                --image="$PROXY_IMAGE" \
                --port=8080 \
                --startup-cpu-boost \
                --depends-on=grafana-mcp \
                --set-env-vars="PUBLIC_URL=${public_url},UPSTREAM_URL=http://127.0.0.1:8000,RESOURCE=${public_url}/mcp,ALLOWED_DOMAINS=${ALLOWED_DOMAINS}" \
                --set-secrets="SIGNING_KEY=mcp-signing-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest"
          }

          # If the service already exists, its run.app URL is stable across
          # revisions -- one deploy suffices. Only a brand-new service needs
          # deploy.sh's two-phase bootstrap (PUBLIC_URL/RESOURCE must match
          # the assigned URL exactly, but that URL isn't known until the
          # service is provisioned).
          EXISTING_URL=$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='value(status.url)' 2>/dev/null || true)

          if [ -n "$EXISTING_URL" ]; then
            echo "== Redeploying existing service (PUBLIC_URL=${EXISTING_URL}) =="
            deploy "$EXISTING_URL"
            SERVICE_URL="$EXISTING_URL"
          else
            echo "== Phase 1: provisioning service to learn its run.app URL =="
            deploy "https://placeholder.invalid"

            SERVICE_URL=$(gcloud run services describe "$SERVICE" \
              --project="$PROJECT_ID" --region="$REGION" \
              --format='value(status.url)')

            echo "== Phase 2: re-deploying with PUBLIC_URL=${SERVICE_URL} =="
            deploy "$SERVICE_URL"

            echo "New service -- add this redirect URI in Google Cloud Console before logging in:"
            echo "  ${SERVICE_URL}/oauth2/callback"
          fi

          echo
          echo "MCP endpoint: ${SERVICE_URL}/mcp"
